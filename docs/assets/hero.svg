<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="garageAlarms — a distributed alarm network with no central hub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1016"/>
      <stop offset="1" stop-color="#111a24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff1f4b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff1f4b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#243447" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" fill="none" stroke="#243447"/>

  <!-- title block -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="64" y="132" font-size="64" font-weight="700" fill="#dce6f0">garage<tspan fill="#22d3ee">Alarms</tspan></text>
    <text x="66" y="178" font-size="24" fill="#7f93a8">A distributed alarm network with no central hub</text>
    <text x="66" y="214" font-size="22" font-weight="600" fill="#dce6f0">Никаких пропущенных тревог</text>
    <g font-size="15" fill="#7f93a8">
      <rect x="66" y="246" width="128" height="30" rx="6" fill="#182433" stroke="#243447"/>
      <text x="130" y="266" text-anchor="middle">ESP32-S3 + H2</text>
      <rect x="206" y="246" width="96" height="30" rx="6" fill="#182433" stroke="#243447"/>
      <text x="254" y="266" text-anchor="middle">Zigbee</text>
      <rect x="314" y="246" width="104" height="30" rx="6" fill="#182433" stroke="#243447"/>
      <text x="366" y="266" text-anchor="middle">Telegram</text>
      <rect x="430" y="246" width="104" height="30" rx="6" fill="#182433" stroke="#243447"/>
      <text x="482" y="266" text-anchor="middle">Pushover</text>
    </g>
    <text x="66" y="316" font-size="14" fill="#7f93a8">never lose an event  ›  never flood the user  ›  everything else</text>
  </g>

  <!-- network motif -->
  <g stroke-width="2" fill="none">
    <!-- zigbee mesh links -->
    <path d="M760 110 L900 80 L1050 120 L1110 230 L980 280 L830 250 Z" stroke="#243447"/>
    <path d="M760 110 L980 280 M900 80 L830 250 M900 80 L1110 230 M760 110 L830 250" stroke="#243447" opacity="0.7"/>
    <!-- active delivery path collector -> leader -->
    <path d="M830 250 L900 80" stroke="#22d3ee" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M830 250 L980 280 L1050 120" stroke="#22d3ee" stroke-dasharray="6 6" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <!-- uplink -->
    <path d="M900 80 L900 30 M1050 120 L1050 30" stroke="#34d399" stroke-dasharray="3 5"/>
  </g>

  <!-- alarm glow on collector -->
  <circle cx="830" cy="250" r="48" fill="url(#glow)">
    <animate attributeName="r" values="34;56;34" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">
    <!-- logic nodes -->
    <rect x="874" y="58" width="52" height="44" rx="8" fill="#182433" stroke="#22d3ee" stroke-width="2"/>
    <text x="900" y="85" fill="#22d3ee" font-weight="700">S3</text>
    <text x="900" y="124" fill="#dce6f0">leader</text>
    <rect x="1024" y="98" width="52" height="44" rx="8" fill="#182433" stroke="#7f93a8" stroke-width="2"/>
    <text x="1050" y="125" fill="#dce6f0" font-weight="700">S3</text>
    <text x="1050" y="164" fill="#7f93a8">follower</text>
    <!-- collectors -->
    <circle cx="760" cy="110" r="16" fill="#182433" stroke="#34d399" stroke-width="2"/>
    <text x="760" y="115" fill="#34d399">H2</text>
    <circle cx="1110" cy="230" r="16" fill="#182433" stroke="#34d399" stroke-width="2"/>
    <text x="1110" y="235" fill="#34d399">H2</text>
    <circle cx="980" cy="280" r="16" fill="#182433" stroke="#34d399" stroke-width="2"/>
    <text x="980" y="285" fill="#34d399">H2</text>
    <circle cx="830" cy="250" r="18" fill="#ff1f4b" stroke="#ff1f4b" stroke-width="2"/>
    <text x="830" y="255" fill="#0b1016" font-weight="700">H2</text>
    <text x="830" y="296" fill="#ff1f4b" font-weight="700">🔥 smoke · garage</text>
    <!-- outside world -->
    <text x="975" y="24" fill="#34d399">Telegram · Pushover · MQTT</text>
  </g>
</svg>
